    <!-- Defensive window.fetch compatibility fix for extensions / test runners -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _currentFetch; },
            set: function(val) { _currentFetch = val; }
          });
        } catch(e) {}
      })();
    </script>

    <!-- Dynamic Origin OG Synchronizer for client execution -->
    <script>
      (function() {
        try {
          if (window.location.origin && !window.location.origin.includes('file://')) {
            var origin = window.location.origin;
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', origin + window.location.pathname);
          }
        } catch(e) {}
      })();
    </script>
